
  <button mat-raised-button (click)="addExamData()"> Add Exam </button>
 <div class="mat-elevation-z8 mt-5">
 <table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="srNo">
    <th mat-header-cell *matHeaderCellDef> Sr No</th>
    <td mat-cell *matCellDef="let element; let i = index">  {{ i }}</td>
  </ng-container>
 <!-- Exam No Column -->
 <ng-container matColumnDef="exam_no">
 <th mat-header-cell *matHeaderCellDef> Exam No</th>
 <td mat-cell *matCellDef="let element"> {{element.exam_no}} </td>
 </ng-container>

 <!--Exam Name Column -->
 <ng-container matColumnDef="exam_name">
 <th mat-header-cell *matHeaderCellDef> Exam Name </th>
 <td mat-cell *matCellDef="let element"> {{element.exam_name}} </td>
 </ng-container>

 <!--Exam Date Column -->
 <ng-container matColumnDef="exam_date">
  <th mat-header-cell *matHeaderCellDef> Exam Date </th>
  <td mat-cell *matCellDef="let element"> {{element.exam_date}} </td>
  </ng-container>

 <!-- Total Question Column -->
 <ng-container matColumnDef="total_question">
 <th mat-header-cell *matHeaderCellDef> Total Question </th>
 <td mat-cell *matCellDef="let element"> {{element.total_question}} </td>
 </ng-container>

 <!-- Passing Marks Column -->
 <ng-container matColumnDef="passing_marks">
  <th mat-header-cell *matHeaderCellDef> Passing Marks </th>
  <td mat-cell *matCellDef="let element"> {{element.passing_marks}} </td>
  </ng-container>

  <!-- Total Question Column -->
 <ng-container matColumnDef="sub_name">
  <th mat-header-cell *matHeaderCellDef> Sub Name </th>
  <td mat-cell *matCellDef="let element"> {{element.sub_name}} </td>
  </ng-container>

  <!-- Total Flag Column -->
 <ng-container matColumnDef="flag">
  <th mat-header-cell *matHeaderCellDef> Flag</th>
  <td mat-cell *matCellDef="let element">{{element.flag}}</td>
  </ng-container>

  <!-- Menu Column -->
 <ng-container matColumnDef="menu">
  <th mat-header-cell *matHeaderCellDef> Menu</th>
  <td mat-cell *matCellDef="let element"><button mat-mini-fab color="accent" [matMenuTriggerFor]="menu"><mat-icon>menu</mat-icon></button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item type="button" (click)="openDialog(element)" >Edit</button><hr>
      <button mat-menu-item type="button"  (click)="clickMethod(element.exam_no)">Delete</button><hr>
      <button mat-menu-item type="button" routerLink="/question-details">Add Question</button>
    </mat-menu></td>
  </ng-container>
 <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
 <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
 </table>

 <mat-paginator [pageSizeOptions]="[5, 10, 20, 25]" showFirstLastButtons></mat-paginator>
 </div>
